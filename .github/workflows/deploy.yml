name: deploy

# Preview on every PR, production on merge to main.
# The site is static (no build step). The only stored secret is the SWA deploy token.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write   # lets the SWA action post the preview URL on the PR

# The event name is part of the group on purpose: when a PR is merged, the
# pull_request "closed" run reports the base branch as its ref and would
# otherwise cancel the push-to-main deploy.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy demo booking page
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_DEMO }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site
          output_location: ""
          skip_app_build: true
      # SECURITY-BASELINE section 3: every booking hostname enforces TLS 1.3.
      # The floor is an edge setting outside source control, so this check is
      # the only thing that notices if it is lost.
      - name: Booking hostname refuses TLS 1.2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          HOST=demo.booklab.co.nz
          if curl -s -o /dev/null --tls-max 1.2 --max-time 30 "https://$HOST/"; then
            echo "::error::$HOST accepted a TLS 1.2 handshake. Set minimum TLS 1.3 on the booking hostname."
            exit 1
          fi
          curl -s -o /dev/null --tlsv1.3 --max-time 30 "https://$HOST/" || { echo "::error::$HOST did not complete a TLS 1.3 handshake."; exit 1; }
          echo "$HOST: TLS 1.2 refused, TLS 1.3 accepted"
      - name: Page is served noindex
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -sI --max-time 30 https://demo.booklab.co.nz/ | grep -qi '^x-robots-tag:.*noindex' || { echo "::error::X-Robots-Tag noindex missing on demo.booklab.co.nz"; exit 1; }

  frontend-close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close SWA preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_DEMO }}
          action: close
